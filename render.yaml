databases:
  - name: vault-postgres
    databaseName: vaultdb
    user: vaultuser
    plan: free

services:
  - type: web
    name: vault-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: vault-postgres
          property: connectionString
